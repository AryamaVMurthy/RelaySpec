[project]
name = "relayspec"
version = "0.1.0"
description = "Retarget frozen speculative drafters with learned linear interfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "torch>=2.6",
  "transformers>=4.54",
  "huggingface-hub>=0.34",
]

[project.urls]
Repository = "https://github.com/AryamaVMurthy/RelaySpec"
Issues = "https://github.com/AryamaVMurthy/RelaySpec/issues"

[project.optional-dependencies]
paper = ["matplotlib==3.10.5", "fonttools==4.63.0", "kiwisolver==1.5.0"]
data = ["datasets>=3.0", "evalplus>=0.3", "pyarrow>=15.0", "sympy>=1.13", "requests>=2.32"]
drift = ["peft>=0.13", "pyarrow>=15.0"]
statistics = ["scipy==1.16.1"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9", "matplotlib==3.10.5", "fonttools==4.63.0", "kiwisolver==1.5.0", "sympy>=1.13", "scipy==1.16.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["manuscript: full PDF and submission-artifact checks; requires a built paper and external PDF tools"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["output", "outputs", "reports", "tmp", "scripts/archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/relayspec"]

[tool.hatch.build.targets.sdist]
include = ["src/relayspec", "pyproject.toml", "README.md", "THIRD_PARTY.md"]
