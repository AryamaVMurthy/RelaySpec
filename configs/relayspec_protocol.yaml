administrative_config_paths:
  - protocol_version
  - seed
  - resources.cpu_count
  - benchmark.max_prompts
  - benchmark.warmups
  - relay_probe.repetitions
  - logging.*
  - model_dimensions.*
  - checkpoint_step

administrative_path_rationales:
  protocol_version: schema identity used by the audit, not an algorithmic hyperparameter
  seed: deterministic data order and method-order rotation; greedy target decoding makes token choice seed independent
  resources.cpu_count: host scheduling request only; GPU timing regions are synchronized and do not use CPU count as a scientific factor
  benchmark.max_prompts: execution cap equal to the immutable manifest cell count (32 development, 500 MATH, 750 breadth, or 8 isolated-memory requests); task counts are separately registered
  benchmark.warmups: one unreported request per rank materializes lazy kernels and caches before timed requests; warm-up output is excluded from every statistic
  relay_probe.repetitions: one complete paired request is run for every immutable manifest item after warm-up; uncertainty is estimated across paired requests rather than treating repeated executions of the same prompt as independent evidence
  logging.*: telemetry and checkpoint cadence affects artifact granularity only and is excluded from model outputs and timed CUDA regions
  model_dimensions.*: dimensions are copied metadata from pinned checkpoints and checked by interface-conformance tests, not chosen values
  checkpoint_step: immutable artifact identity recorded after a declared training budget, not a separately selected hyperparameter
