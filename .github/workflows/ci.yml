name: Code checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install CPU development environment
        run: |
          uv venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv export --locked --no-hashes --no-emit-project --extra paper > /tmp/relayspec-constraints.txt
          uv pip install -c /tmp/relayspec-constraints.txt -e '.[paper]' pytest ruff sympy
      - name: Lint, format, and CPU tests
        run: make check
